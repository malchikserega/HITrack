# Redis configuration for HITrack
#
# This instance is the Celery broker as well as the Django cache. Queued
# Celery messages exist ONLY here, so persistence must stay on: without it a
# Redis restart silently drops every queued scan while Postgres still marks
# the images pending/in_process.

# Append-only file: at most ~1s of messages is lost on a crash.
appendonly yes
appendfsync everysec
dir /data

# Periodic RDB snapshot as a second safety net.
save 300 1

# Allow writes even if background save fails (for development)
stop-writes-on-bgsave-error no

# Set max memory (adjust based on your needs)
# 512MB recommended for production with 2 workers and 1 hour visibility timeout
# For development/testing, 256MB may be sufficient
maxmemory 512mb
# Evict only keys with a TTL (Django cache entries). Broker queues and unacked
# message keys have no TTL, so they are never evicted; allkeys-lru could drop
# a whole queue under memory pressure.
maxmemory-policy volatile-lru

# Log level
loglevel notice

# Bind to all interfaces
bind 0.0.0.0

# Protected mode (disabled for Docker)
protected-mode no
